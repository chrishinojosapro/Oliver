<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oliver AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .orb-wrap {
    position: absolute;
    top: 50%; left: 50%;
    width: 340px; height: 340px;
    margin: -170px 0 0 -170px;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    border-radius: 50%;
    animation: orb-enter 2s ease forwards, spin-cw 12s linear infinite;
  }
  .orb-wrap-inner {
    position: absolute;
    top: 50%; left: 50%;
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation: orb-enter 2s ease forwards;
  }

  @keyframes orb-enter {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }

  .orb-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow:
      0 0 60px rgba(255,255,255,0.12),
      0 0 120px rgba(180,160,255,0.12),
      0 0 200px rgba(100,130,255,0.08),
      inset 0 0 60px rgba(255,255,255,0.05);
  }
  .orb-ring::before {
    content: '';
    position: absolute; inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .orb-ring::after {
    content: '';
    position: absolute; inset: 28px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .orb-ring-inner {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    animation: spin-ccw 7s linear infinite;
  }

  @keyframes spin-cw  { to { transform: rotate(360deg); } }
  @keyframes spin-ccw { to { transform: rotate(-360deg); } }

  .orb-wrap.thinking .orb-ring {
    animation: think-pulse 0.8s ease-in-out infinite alternate;
    will-change: box-shadow, border-color;
  }
  
  @keyframes think-pulse {
    0% { 
      border-color: rgba(255,255,255,0.25);
      box-shadow: 
        0 0 60px rgba(255,255,255,0.12), 
        0 0 120px rgba(180,160,255,0.12), 
        0 0 200px rgba(100,130,255,0.08), 
        inset 0 0 60px rgba(255,255,255,0.05); 
    }
    100% { 
      border-color: rgba(255,255,255,0.6);
      box-shadow: 
        0 0 100px rgba(255,255,255,0.7), 
        0 0 200px rgba(180,160,255,0.5), 
        0 0 300px rgba(100,130,255,0.3), 
        inset 0 0 80px rgba(255,255,255,0.2); 
    }
  }

  header {
    position: relative; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px 14px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05); color: white; cursor: pointer;
  }
  .icon-btn svg { width: 16px; height: 16px; fill: white; }
  .header-center { display: flex; align-items: center; gap: 8px; }
  .status-pip {
    width: 7px; height: 7px; border-radius: 50%; background: white;
    box-shadow: 0 0 8px rgba(255,255,255,0.9);
    animation: pip 2.5s ease-in-out infinite;
  }
  @keyframes pip {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.7); }
  }
  .header-title { font-size: 0.85em; color: rgba(255,255,255,0.45); font-weight: 500; letter-spacing: 0.04em; }

  #chat-container {
    position: relative; z-index: 10;
    flex: 1; min-height: 0;
    padding: 12px 20px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  #chat-container::-webkit-scrollbar { display: none; }

  .message { max-width: 88%; line-height: 1.55; animation: msg-in 0.3s ease forwards; }
  @keyframes msg-in {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .message.user {
    align-self: flex-end;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 10px 16px;
    border-radius: 18px 18px 4px 18px;
    color: rgba(255,255,255,0.55); font-size: 0.92em;
  }
  .message.oliver { align-self: flex-start; max-width: 92%; }
  .sender-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .sender-dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.5); }
  .sender-name { font-size:10px; color:rgba(255,255,255,0.35); font-weight:600; letter-spacing:0.1em; text-transform:uppercase; }
  .message.oliver .msg-text { font-size:1.05em; color:rgba(255,255,255,0.92); font-weight:300; line-height:1.6; }

  .controls {
    position: relative; z-index: 10; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 28px;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 60%, transparent);
  }
  #text-input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: white; padding: 13px 18px; border-radius: 26px;
    font-size: 0.93em; outline: none;
    transition: border-color 0.2s; -webkit-appearance: none;
  }
  #text-input:focus { border-color: rgba(255,255,255,0.35); }
  #text-input::placeholder { color: rgba(255,255,255,0.28); }
  .send-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
  }
  .send-btn:hover { background: rgba(255,255,255,0.2); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn svg { width: 18px; height: 18px; fill: white; }
</style>
</head>
<body>

<div id="ai-orb" class="orb-wrap">
  <div class="orb-ring"></div>
</div>
<div class="orb-wrap-inner">
  <div class="orb-ring-inner"></div>
</div>

<header>
  <button class="icon-btn" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <div class="header-center">
    <div class="status-pip"></div>
    <span class="header-title">Oliver AI</span>
  </div>
  <button class="icon-btn" aria-label="More">
    <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
  </button>
</header>

<div id="chat-container">
  <div class="message oliver">
    <div class="sender-row"><div class="sender-dot"></div><span class="sender-name">Oliver</span></div>
    <div class="msg-text">I'm listening, Chris.</div>
  </div>
</div>

<div class="controls">
  <input type="text" id="text-input" placeholder="Message Oliver…" onkeydown="checkEnter(event)">
  <button class="send-btn" onclick="sendMessage()" aria-label="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  const SUPABASE_PROJECT_URL = "https://einfitykkorutgnbxwly.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpbmZpdHlra29ydXRnbmJ4d2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDU2NTMsImV4cCI6MjA5MzkyMTY1M30.io5d1OWHrtCqsAeLjqsQm7D5tBEsDLNZ_gMZ_geGcLU";
  const EDGE_FUNCTION_URL = "https://einfitykkorutgnbxwly.supabase.co/functions/v1/oliver-brain";
  
  const getSessionId = () => {
    let sid = sessionStorage.getItem('oliver_session_id');
    if (!sid) {
      sid = crypto.randomUUID();
      sessionStorage.setItem('oliver_session_id', sid);
    }
    return sid;
  };

  const sessionStartTime = Date.now();

  function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }

  async function sendMessage() {
    const input = document.getElementById('text-input');
    const text = input.value.trim();
    const orb = document.getElementById('ai-orb');
    if (!text) return;
    
    addMessage(text, 'user');
    input.value = '';
    orb.classList.add('thinking');

    const elapsedSeconds = Math.floor((Date.now() - sessionStartTime) / 1000);
    const mins = Math.floor(elapsedSeconds / 60);
    const secs = elapsedSeconds % 60;
    const timeActive = `${mins} minute(s) and ${secs} second(s)`;

    try {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ 
          message: text,
          sessionDuration: timeActive,
          sessionId: getSessionId()
        })
      });
      
      const data = await res.json();
      orb.classList.remove('thinking');
      
      if (data.status === 'success') {
          addMessage(data.reply, 'oliver');
      } else {
          addMessage("System error: " + (data.error || "Unknown error"), 'oliver');
      }
    } catch (err) {
      orb.classList.remove('thinking');
      addMessage("Connection failed. " + err.message, 'oliver');
    }
  }

  function addMessage(text, sender) {
    const c = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = 'message ' + sender;
    div.innerHTML = sender === 'oliver'
      ? `<div class="sender-row"><div class="sender-dot"></div><span class="sender-name">Oliver</span></div><div class="msg-text">${text.replace(/\n/g,'<br>')}</div>`
      : text.replace(/\n/g,'<br>');
    c.appendChild(div);
    c.scrollTop = c.scrollHeight;
  }
</script>
</body>
</html>
