<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oliver AI</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#050508;
    color:#fff;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    /* iOS safe areas */
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  /* ── STAR CANVAS ── */
  #star-canvas { position:fixed; inset:0; pointer-events:none; z-index:0; }

  /* ── ORB ── */
  .orb-scene {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:300px; height:300px;
    pointer-events:none; z-index:1;
    opacity:0; animation:orb-enter 2s ease forwards;
  }
  @media(max-width:390px){ .orb-scene{ width:240px; height:240px; } }
  @keyframes orb-enter { to { opacity:1; } }

  .orb-glow {
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(ellipse at 40% 35%,
      rgba(160,120,255,0.18) 0%, rgba(80,120,255,0.12) 40%, transparent 70%);
    animation:glow-breathe 4s ease-in-out infinite;
  }
  @keyframes glow-breathe {
    0%,100%{ opacity:.6; transform:scale(1); }
    50%    { opacity:1;  transform:scale(1.08); }
  }
  .orb-ring-outer {
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(255,255,255,0.28);
    box-shadow:0 0 40px rgba(255,255,255,0.08),0 0 80px rgba(160,120,255,0.14),0 0 160px rgba(80,120,255,0.10),inset 0 0 50px rgba(255,255,255,0.04);
    animation:spin-cw 14s linear infinite;
  }
  .orb-ring-outer::before { content:''; position:absolute; inset:-12px; border-radius:50%; border:1px solid rgba(255,255,255,0.09); }
  .orb-ring-outer::after  { content:''; position:absolute; inset:24px;  border-radius:50%; border:1px solid rgba(255,255,255,0.07); }
  .orb-ring-inner {
    position:absolute; inset:48px; border-radius:50%;
    border:1px solid transparent;
    border-top-color:rgba(140,100,255,0.55);
    border-right-color:rgba(80,130,255,0.35);
    border-bottom-color:rgba(140,100,255,0.15);
    animation:spin-ccw 8s linear infinite;
  }
  .orb-core { position:absolute; inset:120px; border-radius:50%; background:radial-gradient(circle,rgba(200,180,255,0.25) 0%,transparent 70%); }

  .orb-scene.thinking .orb-ring-outer { animation:spin-cw 14s linear infinite,think-pulse 0.75s ease-in-out infinite alternate; }
  @keyframes think-pulse {
    0%   { border-color:rgba(255,255,255,0.28); box-shadow:0 0 40px rgba(255,255,255,0.08),0 0 80px rgba(160,120,255,0.14),0 0 160px rgba(80,120,255,0.10),inset 0 0 50px rgba(255,255,255,0.04); }
    100% { border-color:rgba(255,255,255,0.70); box-shadow:0 0 80px rgba(255,255,255,0.65),0 0 160px rgba(160,120,255,0.50),0 0 260px rgba(80,120,255,0.30),inset 0 0 70px rgba(255,255,255,0.15); }
  }
  .orb-scene.speaking .orb-ring-outer { animation:spin-cw 14s linear infinite,speak-pulse 0.5s ease-in-out infinite alternate; }
  .orb-scene.speaking .orb-glow       { animation:speak-glow 0.5s ease-in-out infinite alternate; }
  @keyframes speak-pulse {
    0%   { border-color:rgba(120,180,255,0.45); box-shadow:0 0 50px rgba(100,160,255,0.25),0 0 100px rgba(120,100,255,0.30),0 0 180px rgba(80,120,255,0.18),inset 0 0 40px rgba(100,160,255,0.08); }
    100% { border-color:rgba(180,140,255,0.80); box-shadow:0 0 100px rgba(100,160,255,0.60),0 0 180px rgba(140,100,255,0.55),0 0 280px rgba(80,120,255,0.35),inset 0 0 80px rgba(140,100,255,0.18); }
  }
  @keyframes speak-glow { 0%{ opacity:.7; transform:scale(1.0); } 100%{ opacity:1; transform:scale(1.18); } }
  .orb-scene.listening .orb-ring-outer { animation:spin-cw 14s linear infinite,listen-pulse 1.2s ease-in-out infinite alternate; }
  @keyframes listen-pulse {
    0%   { border-color:rgba(255,255,255,0.28); box-shadow:0 0 40px rgba(255,255,255,0.08),0 0 90px rgba(200,120,255,0.20); }
    100% { border-color:rgba(220,180,255,0.55); box-shadow:0 0 70px rgba(200,160,255,0.40),0 0 160px rgba(160,100,255,0.35); }
  }
  @keyframes spin-cw  { to{ transform:rotate(360deg);  } }
  @keyframes spin-ccw { to{ transform:rotate(-360deg); } }

  /* ── HEADER ── */
  header {
    position:relative; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px 12px; flex-shrink:0;
  }
  .icon-btn {
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.14);
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.05); color:white; cursor:pointer;
    touch-action:manipulation;
    transition:background 0.2s;
  }
  .icon-btn:active { background:rgba(255,255,255,0.14); }
  .icon-btn svg { width:17px; height:17px; fill:white; }
  .header-center { display:flex; align-items:center; gap:8px; }
  .status-pip {
    width:7px; height:7px; border-radius:50%;
    background:white; box-shadow:0 0 8px rgba(255,255,255,0.9);
    animation:pip 2.5s ease-in-out infinite;
  }
  @keyframes pip { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.4; transform:scale(.7); } }
  .header-title { font-size:0.85em; color:rgba(255,255,255,0.42); font-weight:500; letter-spacing:0.05em; }

  /* ── CHAT ── */
  #chat-container {
    position:relative; z-index:10;
    flex:1; min-height:0;
    padding:12px 16px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:14px;
  }
  #chat-container::-webkit-scrollbar { display:none; }

  @keyframes msg-in { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .message.user {
    align-self:flex-end; max-width:84%;
    padding:11px 16px;
    border-radius:20px 20px 5px 20px;
    font-size:0.93em; line-height:1.55;
    color:rgba(255,255,255,0.60);
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    animation:msg-in 0.28s ease forwards;
  }
  .message.oliver { align-self:flex-start; max-width:92%; animation:msg-in 0.28s ease forwards; }
  .sender-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .sender-dot { width:5px; height:5px; border-radius:50%; background:rgba(160,120,255,0.7); box-shadow:0 0 6px rgba(140,100,255,0.6); }
  .sender-name { font-size:10px; color:rgba(255,255,255,0.30); font-weight:600; letter-spacing:0.12em; text-transform:uppercase; }
  .oliver-card {
    padding:12px 16px;
    border-radius:5px 20px 20px 20px;
    background:rgba(120,90,220,0.08);
    border:1px solid rgba(160,120,255,0.18);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .msg-text { font-size:1.02em; color:rgba(255,255,255,0.90); font-weight:300; line-height:1.65; }

  /* ── STATUS STRIP ── */
  #interim-text {
    position:relative; z-index:10;
    min-height:16px; flex-shrink:0;
    padding:0 20px 1px;
    font-size:0.82em; font-style:italic;
    color:rgba(200,160,255,0.45); text-align:center;
  }
  #voice-status {
    position:relative; z-index:10;
    text-align:center;
    font-size:0.74em; letter-spacing:0.09em;
    color:rgba(255,255,255,0.26);
    height:15px; line-height:15px;
    transition:color 0.3s; flex-shrink:0;
    margin-bottom:3px;
  }
  #voice-status.active { color:rgba(200,160,255,0.65); }

  /* ── CONTROLS ── */
  .controls {
    position:relative; z-index:10; flex-shrink:0;
    display:flex; align-items:center; gap:9px;
    padding:8px 14px 16px;
    background:linear-gradient(to top,rgba(5,5,8,0.95) 60%,transparent);
  }

  #text-input {
    flex:1; min-width:0;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.13);
    color:white; padding:13px 16px; border-radius:26px;
    font-size:16px; /* 16px prevents iOS zoom on focus */
    outline:none;
    transition:border-color 0.2s, background 0.2s;
    -webkit-appearance:none;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  #text-input:focus { border-color:rgba(160,120,255,0.45); background:rgba(255,255,255,0.07); }
  #text-input::placeholder { color:rgba(255,255,255,0.26); }

  /* shared round button base */
  .ctrl-btn {
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; touch-action:manipulation;
    transition:background 0.2s, transform 0.12s, box-shadow 0.2s, border-color 0.2s;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
  }
  .ctrl-btn:active { transform:scale(0.91); }
  .ctrl-btn svg { width:20px; height:20px; fill:rgba(255,255,255,0.65); transition:fill 0.2s; }

  /* Send */
  #send-btn {
    background:rgba(120,90,220,0.22);
    border-color:rgba(160,120,255,0.35);
  }
  #send-btn:active { background:rgba(140,100,255,0.40); }
  #send-btn svg { fill:white; }

  /* Mic */
  #mic-btn.recording {
    background:rgba(200,100,255,0.20);
    border-color:rgba(200,120,255,0.55);
    animation:mic-ring 1s ease-in-out infinite alternate;
  }
  #mic-btn.recording svg { fill:rgba(230,190,255,1); }
  @keyframes mic-ring {
    0%  { box-shadow:0 0 10px rgba(180,100,255,0.25); }
    100%{ box-shadow:0 0 26px rgba(200,120,255,0.60); }
  }
  #mic-btn.locked { opacity:0.28; pointer-events:none; }

  /* Convo toggle */
  #convo-btn.active {
    background:rgba(100,180,255,0.18);
    border-color:rgba(120,180,255,0.50);
    box-shadow:0 0 14px rgba(100,160,255,0.28);
  }
  #convo-btn.active svg { fill:rgba(160,210,255,1); }
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<div id="ai-orb" class="orb-scene">
  <div class="orb-glow"></div>
  <div class="orb-ring-outer"></div>
  <div class="orb-ring-inner"></div>
  <div class="orb-core"></div>
</div>

<header>
  <button class="icon-btn" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <div class="header-center">
    <div class="status-pip"></div>
    <span class="header-title">Oliver AI</span>
  </div>
  <button class="icon-btn" aria-label="More">
    <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
  </button>
</header>

<div id="chat-container">
  <div class="message oliver">
    <div class="sender-row"><div class="sender-dot"></div><span class="sender-name">Oliver</span></div>

</div>

<div id="interim-text"></div>
<div id="voice-status"></div>

<div class="controls">
  <!-- Mic -->
  <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()" aria-label="Microphone">
    <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-2 16.93A8.001 8.001 0 0 0 19.94 12H18a6 6 0 0 1-12 0H4.06A8.001 8.001 0 0 0 10 17.93V21H8v2h8v-2h-2v-3.07z"/></svg>

  <input type="text" id="text-input" placeholder="Message Oliver…" onkeydown="checkEnter(event)" autocomplete="off" autocorrect="off" spellcheck="false">

  <!-- Send -->
  <button class="ctrl-btn" id="send-btn" onclick="sendMessage()" aria-label="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>

  <!-- Continuous conversation -->
  <button class="ctrl-btn" id="convo-btn" onclick="toggleContinuous()" aria-label="Conversation mode">
    <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-3 11H7v-2h10v2zm0-3H7V8h10v2z"/></svg>
  </button>
</div>

<script>
/* ════════════════════════════════════════
   SHOOTING STARS
════════════════════════════════════════ */
(function(){
  const cv = document.getElementById('star-canvas'), cx = cv.getContext('2d');
  let W, H;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); window.addEventListener('resize', resize);

  const STARS = Array.from({length:160}, () => ({
    x:Math.random(), y:Math.random(),
    r:Math.random()*0.9+0.2, a:Math.random()*0.5+0.1,
    ts:Math.random()*0.015+0.005, to:Math.random()*Math.PI*2,
  }));
  const SHOTS = [];
  const spawn = () => {
    const ang=(Math.random()*35+15)*Math.PI/180, spd=Math.random()*5+4;
    SHOTS.push({x:Math.random()*W,y:Math.random()*H*0.6,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,len:Math.random()*120+60,life:1,decay:Math.random()*0.012+0.010});
  };
  const schedule = () => { spawn(); setTimeout(schedule, Math.random()*1600+1200); };
  schedule();

  let t=0;
  (function draw(){
    cx.clearRect(0,0,W,H); t+=0.016;
    for(const s of STARS){
      const a=s.a*(0.6+0.4*Math.sin(t*s.ts*60+s.to));
      cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      cx.fillStyle=`rgba(255,255,255,${a})`; cx.fill();
    }
    for(let i=SHOTS.length-1;i>=0;i--){
      const s=SHOTS[i], mag=Math.hypot(s.vx,s.vy);
      const tx=s.x-s.vx*(s.len/mag), ty=s.y-s.vy*(s.len/mag);
      const g=cx.createLinearGradient(tx,ty,s.x,s.y);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(0.6,`rgba(200,170,255,${s.life*0.5})`);
      g.addColorStop(1,`rgba(255,255,255,${s.life})`);
      cx.beginPath(); cx.moveTo(tx,ty); cx.lineTo(s.x,s.y);
      cx.strokeStyle=g; cx.lineWidth=1.5; cx.stroke();
      const grd=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,3);
      grd.addColorStop(0,`rgba(255,255,255,${s.life})`); grd.addColorStop(1,'rgba(255,255,255,0)');
      cx.beginPath(); cx.arc(s.x,s.y,3,0,Math.PI*2); cx.fillStyle=grd; cx.fill();
      s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
      if(s.life<=0) SHOTS.splice(i,1);
    }
    requestAnimationFrame(draw);
  })();
})();

/* ════════════════════════════════════════
   CONFIG
════════════════════════════════════════ */
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpbmZpdHlra29ydXRnbmJ4d2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDU2NTMsImV4cCI6MjA5MzkyMTY1M30.io5d1OWHrtCqsAeLjqsQm7D5tBEsDLNZ_gMZ_geGcLU';
const EDGE_FUNCTION_URL = 'https://einfitykkorutgnbxwly.supabase.co/functions/v1/oliver-brain';
const XI_API_KEY        = 'sk_4474987f8187a823562d41e5886b84c531b82bb2832efe62';
const XI_VOICE_ID       = 'lUTamkMw7gOzZbFIwmq4';
const XI_URL            = `https://api.elevenlabs.io/v1/text-to-speech/${XI_VOICE_ID}`;

/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
const orb        = document.getElementById('ai-orb');
const micBtn     = document.getElementById('mic-btn');
const convoBtn   = document.getElementById('convo-btn');
const statusEl   = document.getElementById('voice-status');
const interimEl  = document.getElementById('interim-text');

let isRecording  = false;
let isSpeaking   = false;
let isContinuous = false;
let recognition  = null;
let currentAudio = null;
let audioCtx     = null;
let audioUnlocked= false;

const sessionStart = Date.now();
const getSessionId = () => {
  let sid = sessionStorage.getItem('oliver_sid');
  if(!sid){ sid=crypto.randomUUID(); sessionStorage.setItem('oliver_sid',sid); }
  return sid;
};

/* ════════════════════════════════════════
   AUDIO CONTEXT — unlock on first gesture
════════════════════════════════════════ */
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function unlockAudio(){
  if(audioUnlocked) return;
  const ctx = getAudioCtx();
  if(ctx.state==='suspended') ctx.resume();
  const buf=ctx.createBuffer(1,1,22050), src=ctx.createBufferSource();
  src.buffer=buf; src.connect(ctx.destination); src.start(0);
  audioUnlocked=true;
}

/* ════════════════════════════════════════
   ORB + STATUS
════════════════════════════════════════ */
function setOrb(state){
  orb.classList.remove('thinking','speaking','listening');
  if(state) orb.classList.add(state);
}
function setStatus(msg, active=false){
  statusEl.textContent = msg;
  statusEl.className   = active ? 'active' : '';
}

/* ════════════════════════════════════════
   TTS TEXT CLEANER
   Strips markdown symbols so they aren't
   read aloud — but keeps the FULL text.
   Token saving comes from Oliver's backend
   keeping responses concise, not truncation.
════════════════════════════════════════ */
function cleanForTTS(text){
  return text
    .replace(/\*\*(.+?)\*\*/g,'$1')  // bold
    .replace(/\*(.+?)\*/g,'$1')       // italic
    .replace(/`{1,3}[^`]*`{1,3}/g,'') // code spans/blocks
    .replace(/#+\s/g,'')              // headings
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1') // links → label only
    .replace(/\n{2,}/g,' ')
    .replace(/\n/g,' ')
    .replace(/\s{2,}/g,' ')
    .trim();
}

/* ════════════════════════════════════════
   TEXT SEND
════════════════════════════════════════ */
function checkEnter(e){ if(e.key==='Enter') sendMessage(); }

async function sendMessage(){
  unlockAudio();
  const inp  = document.getElementById('text-input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value='';
  await pipeline(text, false); // text mode — no TTS
}

/* ════════════════════════════════════════
   CORE PIPELINE
════════════════════════════════════════ */
async function pipeline(userText, speakReply=true){
  if(isSpeaking) return;
  addMessage(userText,'user');
  setOrb('thinking'); setStatus('thinking…',true);

  const elapsed    = Math.floor((Date.now()-sessionStart)/1000);
  const timeActive = `${Math.floor(elapsed/60)} minute(s) and ${elapsed%60} second(s)`;

  try{
    const res  = await fetch(EDGE_FUNCTION_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
      body:JSON.stringify({message:userText,sessionDuration:timeActive,sessionId:getSessionId()}),
    });
    const data  = await res.json();
    const reply = data.status==='success' ? data.reply : 'System error: '+(data.error||'Unknown error');
    addMessage(reply,'oliver');
    if(speakReply){ await speakText(cleanForTTS(reply)); }
    else          { setOrb(null); setStatus(''); }
  }catch(err){
    setOrb(null); setStatus('');
    addMessage('Connection failed. '+err.message,'oliver');
  }
}

function addMessage(text,sender){
  const c=document.getElementById('chat-container');
  const div=document.createElement('div');
  div.className='message '+sender;
  if(sender==='oliver'){
    div.innerHTML=`<div class="sender-row"><div class="sender-dot"></div><span class="sender-name">Oliver</span></div>
      <div class="oliver-card"><div class="msg-text">${text.replace(/\n/g,'<br>')}</div></div>`;
  } else {
    div.textContent=text;
  }
  c.appendChild(div);
  c.scrollTop=c.scrollHeight;
}

/* ════════════════════════════════════════
   ELEVENLABS TTS
   Feedback prevention: mic is locked while
   audio plays. After playback we wait 600ms
   before reopening (lets room echo die out).
════════════════════════════════════════ */
async function speakText(text){
  isSpeaking=true;
  setOrb('speaking'); setStatus('speaking…',true);
  micBtn.classList.add('locked');

  try{
    const ctx=getAudioCtx();
    if(ctx.state==='suspended') await ctx.resume();

    const res = await fetch(XI_URL,{
      method:'POST',
      headers:{'xi-api-key':XI_API_KEY,'Content-Type':'application/json','Accept':'audio/mpeg'},
      body:JSON.stringify({
        text,
        model_id:'eleven_turbo_v2_5',
        voice_settings:{stability:0.45,similarity_boost:0.82,style:0.20,use_speaker_boost:true},
      }),
    });
    if(!res.ok) throw new Error(`ElevenLabs ${res.status}: ${await res.text()}`);

    const decoded = await ctx.decodeAudioData(await res.arrayBuffer());
    await new Promise((resolve,reject)=>{
      const src=ctx.createBufferSource();
      src.buffer=decoded;
      src.connect(ctx.destination);
      src.onended=resolve;
      src.start(0);
      currentAudio=src;
    });

  }catch(err){
    console.warn('TTS error:',err);
    addMessage('⚠ Voice error: '+err.message,'oliver');
  }finally{
    currentAudio=null;
    isSpeaking=false;
    setOrb(null); setStatus('');
    micBtn.classList.remove('locked');

    // Wait for speaker echo to clear before reopening mic
    const delay = isContinuous ? 650 : 0;
    setTimeout(()=>{
      if(isContinuous) startListening();
    }, delay);
  }
}

/* ════════════════════════════════════════
   CONTINUOUS CONVERSATION
════════════════════════════════════════ */
function toggleContinuous(){
  unlockAudio();
  isContinuous=!isContinuous;
  convoBtn.classList.toggle('active',isContinuous);
  if(isContinuous){
    setStatus('conversation on',true);
    setTimeout(()=>{ if(isContinuous&&!isRecording&&!isSpeaking) startListening(); },300);
  }else{
    setStatus('conversation off');
    setTimeout(()=>setStatus(''),1600);
    stopRecording();
  }
}

function startListening(){
  if(isRecording||isSpeaking) return;
  recognition=buildRecognition();
  if(!recognition) return;
  try{ recognition.start(); }catch(_){}
}

/* ════════════════════════════════════════
   SPEECH RECOGNITION
════════════════════════════════════════ */
function buildRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  const r=new SR();
  r.continuous=false; r.interimResults=true; r.lang='en-US';

  r.onstart=()=>{
    isRecording=true;
    micBtn.classList.add('recording');
    setOrb('listening'); setStatus('listening…',true);
  };

  r.onresult=(e)=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      e.results[i].isFinal ? (final+=t) : (interim+=t);
    }
    interimEl.textContent=interim||final;
    if(final){
      interimEl.textContent='';
      stopRecording();
      pipeline(final.trim(), true);
    }
  };

  r.onerror=(e)=>{
    console.warn('Speech error:',e.error);
    stopRecording();
    if(e.error!=='no-speech'&&e.error!=='aborted'){
      setStatus('mic error — try again');
      setTimeout(()=>setStatus(''),2200);
    }
  };

  r.onend=()=>{ if(isRecording) stopRecording(); };
  return r;
}

function toggleMic(){
  unlockAudio();
  if(isSpeaking) return;
  if(isRecording){ stopRecording(); return; }
  if(currentAudio){ try{ currentAudio.stop(); }catch(_){} currentAudio=null; isSpeaking=false; micBtn.classList.remove('locked'); }
  startListening();
}

function stopRecording(){
  isRecording=false;
  micBtn.classList.remove('recording');
  interimEl.textContent='';
  try{ if(recognition) recognition.stop(); }catch(_){}
  if(!isSpeaking&&!isContinuous){ setOrb(null); setStatus(''); }
}
