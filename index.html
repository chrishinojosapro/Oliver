<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oliver AI</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#050508; color:#fff;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden; position:relative;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  #star-canvas { position:fixed; inset:0; pointer-events:none; z-index:0; }

  .orb-scene {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:300px; height:300px;
    pointer-events:none; z-index:1;
    opacity:0; animation:orb-enter 2s ease forwards;
  }
  @media(max-width:390px){ .orb-scene{ width:240px; height:240px; } }
  @keyframes orb-enter { to{ opacity:1; } }

  .orb-glow {
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(ellipse at 40% 35%,
      rgba(160,120,255,0.18) 0%, rgba(80,120,255,0.12) 40%, transparent 70%);
    animation:glow-breathe 4s ease-in-out infinite;
  }
  @keyframes glow-breathe {
    0%,100%{ opacity:.6; transform:scale(1); }
    50%    { opacity:1;  transform:scale(1.08); }
  }
  .orb-ring-outer {
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(255,255,255,0.28);
    box-shadow:0 0 40px rgba(255,255,255,0.08),
               0 0 80px rgba(160,120,255,0.14),
               0 0 160px rgba(80,120,255,0.10),
               inset 0 0 50px rgba(255,255,255,0.04);
    animation:spin-cw 14s linear infinite;
  }
  .orb-ring-outer::before { content:''; position:absolute; inset:-12px; border-radius:50%; border:1px solid rgba(255,255,255,0.09); }
  .orb-ring-outer::after  { content:''; position:absolute; inset:24px;  border-radius:50%; border:1px solid rgba(255,255,255,0.07); }
  .orb-ring-inner {
    position:absolute; inset:48px; border-radius:50%;
    border:1px solid transparent;
    border-top-color:rgba(140,100,255,0.55);
    border-right-color:rgba(80,130,255,0.35);
    border-bottom-color:rgba(140,100,255,0.15);
    animation:spin-ccw 8s linear infinite;
  }
  .orb-core { position:absolute; inset:120px; border-radius:50%; background:radial-gradient(circle,rgba(200,180,255,0.25) 0%,transparent 70%); }

  .orb-scene.thinking .orb-ring-outer { animation:spin-cw 14s linear infinite,think-pulse 0.75s ease-in-out infinite alternate; }
  @keyframes think-pulse {
    0%   { border-color:rgba(255,255,255,0.28); box-shadow:0 0 40px rgba(255,255,255,0.08),0 0 80px rgba(160,120,255,0.14),0 0 160px rgba(80,120,255,0.10),inset 0 0 50px rgba(255,255,255,0.04); }
    100% { border-color:rgba(255,255,255,0.70); box-shadow:0 0 80px rgba(255,255,255,0.65),0 0 160px rgba(160,120,255,0.50),0 0 260px rgba(80,120,255,0.30),inset 0 0 70px rgba(255,255,255,0.15); }
  }
  .orb-scene.speaking .orb-ring-outer { animation:spin-cw 14s linear infinite,speak-pulse 0.5s ease-in-out infinite alternate; }
  .orb-scene.speaking .orb-glow       { animation:speak-glow 0.5s ease-in-out infinite alternate; }
  @keyframes speak-pulse {
    0%   { border-color:rgba(120,180,255,0.45); box-shadow:0 0 50px rgba(100,160,255,0.25),0 0 100px rgba(120,100,255,0.30),0 0 180px rgba(80,120,255,0.18),inset 0 0 40px rgba(100,160,255,0.08); }
    100% { border-color:rgba(180,140,255,0.80); box-shadow:0 0 100px rgba(100,160,255,0.60),0 0 180px rgba(140,100,255,0.55),0 0 280px rgba(80,120,255,0.35),inset 0 0 80px rgba(140,100,255,0.18); }
  }
  @keyframes speak-glow { 0%{ opacity:.7; transform:scale(1.0); } 100%{ opacity:1; transform:scale(1.18); } }
  .orb-scene.listening .orb-ring-outer { animation:spin-cw 14s linear infinite,listen-pulse 1.2s ease-in-out infinite alternate; }
  @keyframes listen-pulse {
    0%   { border-color:rgba(255,255,255,0.28); box-shadow:0 0 40px rgba(255,255,255,0.08),0 0 90px rgba(200,120,255,0.20); }
    100% { border-color:rgba(220,180,255,0.55); box-shadow:0 0 70px rgba(200,160,255,0.40),0 0 160px rgba(160,100,255,0.35); }
  }
  @keyframes spin-cw  { to{ transform:rotate(360deg);  } }
  @keyframes spin-ccw { to{ transform:rotate(-360deg); } }

  header {
    position:relative; z-index:10;
    display:flex; justify-content:center; align-items:center;
    padding:16px 20px 12px; flex-shrink:0;
  }
  .header-center { display:flex; align-items:center; gap:8px; }
  .status-pip {
    width:7px; height:7px; border-radius:50%;
    background:white; box-shadow:0 0 8px rgba(255,255,255,0.9);
    animation:pip 2.5s ease-in-out infinite;
  }
  @keyframes pip { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.4; transform:scale(.7); } }
  .header-title { font-size:0.85em; color:rgba(255,255,255,0.42); font-weight:500; letter-spacing:0.05em; }

  #chat-container {
    position:relative; z-index:10;
    flex:1; min-height:0;
    padding:12px 16px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:14px;
  }
  #chat-container::-webkit-scrollbar { display:none; }

  @keyframes msg-in { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .hidden-voice { display: none !important; }

  .message.user {
    align-self:flex-end; max-width:84%;
    padding:11px 16px;
    border-radius:20px 20px 5px 20px;
    font-size:0.93em; line-height:1.55;
    color:rgba(255,255,255,0.60);
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    animation:msg-in 0.28s ease forwards;
  }
  .message.oliver { align-self:flex-start; max-width:92%; animation:msg-in 0.28s ease forwards; }
  .sender-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .sender-dot { width:5px; height:5px; border-radius:50%; background:rgba(160,120,255,0.7); box-shadow:0 0 6px rgba(140,100,255,0.6); }
  .sender-name { font-size:10px; color:rgba(255,255,255,0.30); font-weight:600; letter-spacing:0.12em; text-transform:uppercase; }
  .oliver-card {
    padding:12px 16px;
    border-radius:5px 20px 20px 20px;
    background:rgba(120,90,220,0.08);
    border:1px solid rgba(160,120,255,0.18);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .msg-text { font-size:1.02em; color:rgba(255,255,255,0.90); font-weight:300; line-height:1.65; }
  .msg-para { margin-bottom:12px; }
  .msg-para:last-child { margin-bottom:0; }
  .msg-image { display:block; max-width:100%; border-radius:12px; margin-bottom:8px; border:1px solid rgba(255,255,255,0.10); }

  .drive-badge {
    display:inline-flex; align-items:center; gap:5px;
    margin-top:6px; padding:3px 10px; border-radius:12px; font-size:0.74em;
    background:rgba(100,180,100,0.15); border:1px solid rgba(100,200,100,0.25);
    color:rgba(150,220,150,0.85);
  }
  .drive-badge svg { width:11px; height:11px; fill:rgba(150,220,150,0.85); }

  .chat-canvas-btn {
    display:inline-flex; align-items:center; gap:8px;
    margin-top:10px; padding:8px 14px; border-radius:8px;
    background:rgba(140,100,255,0.15); border:1px solid rgba(160,120,255,0.35);
    color:rgba(200,170,255,0.95); font-size:0.85em; font-weight:500;
    cursor:pointer; transition:all 0.2s; -webkit-tap-highlight-color:transparent;
  }
  .chat-canvas-btn:active { background:rgba(140,100,255,0.3); transform:scale(0.98); }
  .chat-canvas-btn svg { width:14px; height:14px; fill:currentColor; }

  #img-preview-bar {
    position:relative; z-index:10; flex-shrink:0;
    display:none; align-items:center; gap:10px;
    padding:8px 16px 4px;
  }
  #img-preview-bar.visible { display:flex; }
  #img-preview-wrap { position:relative; display:inline-block; }
  #img-preview {
    width:64px; height:64px; border-radius:10px; object-fit:cover;
    border:1px solid rgba(160,120,255,0.35);
    box-shadow:0 0 12px rgba(140,100,255,0.25);
  }
  #img-preview-remove {
    position:absolute; top:-6px; right:-6px;
    width:20px; height:20px; border-radius:50%;
    background:rgba(30,20,50,0.95); border:1px solid rgba(255,255,255,0.20);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation;
  }
  #img-preview-remove svg { width:10px; height:10px; fill:rgba(255,255,255,0.70); }
  #img-preview-info { font-size:0.78em; color:rgba(255,255,255,0.38); line-height:1.4; }
  #img-preview-name { color:rgba(200,170,255,0.75); font-size:0.82em; }

  #waveform {
    position:relative; z-index:10;
    height:28px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    gap:3px; padding:0 20px;
    opacity:0; transition:opacity 0.35s; pointer-events:none;
  }
  #waveform.visible { opacity:1; }
  .wave-bar { width:3px; border-radius:2px; background:rgba(200,160,255,0.55); height:4px; }
  #waveform.thinking .wave-bar { background:rgba(255,255,255,0.35); }

  .controls {
    position:relative; z-index:10; flex-shrink:0;
    display:flex; align-items:center; gap:9px;
    padding:8px 14px 16px;
    background:linear-gradient(to top,rgba(5,5,8,0.95) 60%,transparent);
  }
  #text-input {
    flex:1; min-width:0;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.13);
    color:white; padding:13px 16px; border-radius:26px;
    font-size:16px; outline:none;
    transition:border-color 0.2s, background 0.2s;
    -webkit-appearance:none;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  #text-input:focus { border-color:rgba(160,120,255,0.45); background:rgba(255,255,255,0.07); }
  #text-input::placeholder { color:rgba(255,255,255,0.26); }

  .ctrl-btn {
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; touch-action:manipulation;
    transition:background 0.2s, transform 0.12s, box-shadow 0.2s, border-color 0.2s;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
  }
  .ctrl-btn:active { transform:scale(0.91); }
  .ctrl-btn svg { width:20px; height:20px; fill:rgba(255,255,255,0.65); transition:fill 0.2s; }

  #send-btn { background:rgba(120,90,220,0.22); border-color:rgba(160,120,255,0.35); }
  #send-btn:active { background:rgba(140,100,255,0.40); }
  #send-btn svg { fill:white; }

  #mic-btn.recording { background:rgba(200,100,255,0.20); border-color:rgba(200,120,255,0.55); animation:mic-ring 1s ease-in-out infinite alternate; }
  #mic-btn.recording svg { fill:rgba(230,190,255,1); }
  @keyframes mic-ring { 0%{ box-shadow:0 0 10px rgba(180,100,255,0.25); } 100%{ box-shadow:0 0 26px rgba(200,120,255,0.60); } }

  #img-btn.has-image { background:rgba(140,100,255,0.22); border-color:rgba(160,120,255,0.55); box-shadow:0 0 14px rgba(140,100,255,0.30); }
  #img-btn.has-image svg { fill:rgba(200,170,255,1); }
  #img-btn.uploading { opacity:0.45; pointer-events:none; }

  #convo-btn.active { background:rgba(100,180,255,0.18); border-color:rgba(120,180,255,0.50); box-shadow:0 0 14px rgba(100,160,255,0.28); }
  #convo-btn.active svg { fill:rgba(160,210,255,1); }
  #file-input { display:none; }

  #oliver-canvas {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform 0.42s cubic-bezier(0.32,0.72,0,1);
    pointer-events:none;
  }
  #oliver-canvas.open { transform:translateY(0); pointer-events:all; }
  #canvas-backdrop { flex:0 0 60px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; cursor:pointer; transition:flex 0.3s; }
  #canvas-handle { width:40px; height:4px; border-radius:2px; background:rgba(255,255,255,0.20); }
  #canvas-panel {
    flex:1; display:flex; flex-direction:column;
    background:rgba(8,6,18,0.97);
    border-top:1px solid rgba(160,120,255,0.22);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    box-shadow:0 -20px 80px rgba(0,0,0,0.6);
    overflow:hidden; border-radius:24px 24px 0 0;
    transition:border-radius 0.3s;
  }
  #canvas-header { display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,0.06); }
  #canvas-title { font-size:0.82em; font-weight:500; letter-spacing:0.06em; color:rgba(200,160,255,0.75); text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  #canvas-type-badge { font-size:0.70em; padding:2px 8px; border-radius:10px; background:rgba(140,100,255,0.18); border:1px solid rgba(160,120,255,0.25); color:rgba(180,150,255,0.80); letter-spacing:0.08em; }
  
  .canvas-controls { display:flex; gap:8px; }
  .canvas-header-btn {
    width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation; transition:background 0.2s;
  }
  .canvas-header-btn:active { background:rgba(255,255,255,0.12); }
  .canvas-header-btn svg { width:14px; height:14px; fill:rgba(255,255,255,0.55); }

  #canvas-body-wrap { flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  #canvas-body { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:16px 18px; }
  #canvas-body::-webkit-scrollbar { display:none; }
  
  #canvas-body.type-code { background:#0d1117; padding:0; display:flex; flex-direction:column; position:relative; }
  #canvas-code-wrap { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:16px 0; }
  #canvas-code { 
    font-family:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; 
    font-size:13.5px; line-height:1.6; color:#c9d1d9; white-space:pre; word-wrap:normal; margin:0; tab-size:4; min-width:min-content; 
    counter-reset: line-counter; 
  }
  .line-row { display:flex; padding:0 16px; }
  .line-row:hover { background:rgba(255,255,255,0.04); }
  .line-num { 
    flex-shrink:0; width:35px; color:#484f58; user-select:none; text-align:right; 
    margin-right:16px; border-right:1px solid #30363d; padding-right:10px; font-size:12px; line-height:1.8; 
  }
  .line-num::before { counter-increment: line-counter; content: counter(line-counter); }
  .line-content { white-space:pre; }
  
  .tok-kw  { color:#ff7b72; }
  .tok-str { color:#a5d6ff; }
  .tok-num { color:#79c0ff; }
  .tok-cmt { color:#8b949e; font-style:italic; }
  .tok-fn  { color:#d2a8ff; }
  
  #canvas-body.type-image { display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.30); }
  #canvas-img { max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,0.5); object-fit:contain; }
  #canvas-body.type-pdf { padding:0; background:#333; }
  #canvas-body.type-video { display:flex; align-items:center; justify-content:center; background:#000; padding:0; }
  #canvas-iframe { width:100%; height:100%; border:none; border-radius:0; background:white; }
  video.canvas-vid { width:100%; max-height:100%; outline:none; }

  #canvas-body.type-markdown { font-size:0.97em; line-height:1.75; color:rgba(255,255,255,0.85); }
  #canvas-body.type-markdown h1,#canvas-body.type-markdown h2,#canvas-body.type-markdown h3 { color:rgba(200,170,255,0.95); font-weight:500; margin:1em 0 0.4em; }
  #canvas-body.type-markdown code { font-family:ui-monospace,monospace; font-size:0.88em; background:rgba(140,100,255,0.15); padding:1px 5px; border-radius:4px; color:rgba(200,170,255,0.90); }
  #canvas-body.type-markdown pre { background:#0d1117; padding:12px; border-radius:8px; overflow-x:auto; border:1px solid #30363d; margin:1em 0; }
  #canvas-body.type-markdown pre code { background:transparent; padding:0; color:#c9d1d9; }
  #canvas-body.type-markdown ul,#canvas-body.type-markdown ol { padding-left:1.4em; margin:.5em 0; }
  #canvas-body.type-markdown li { margin:.25em 0; }
  #canvas-body.type-markdown strong { color:rgba(255,255,255,0.95); }
  #canvas-body.type-markdown a { color:rgba(140,180,255,0.90); }
  #canvas-body.type-markdown hr { border:none; border-top:1px solid rgba(255,255,255,0.08); margin:1.2em 0; }
  
  #canvas-copy { 
    position:absolute; top:12px; right:12px; padding:6px 14px; border-radius:6px; 
    background:#21262d; border:1px solid #30363d; color:#c9d1d9; font-size:0.75em; 
    font-weight:600; cursor:pointer; touch-action:manipulation; transition:background 0.2s, border-color 0.2s; z-index:10; 
  }
  #canvas-copy:active { background:#30363d; border-color:#8b949e; }
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<div id="ai-orb" class="orb-scene">
  <div class="orb-glow"></div>
  <div class="orb-ring-outer"></div>
  <div class="orb-ring-inner"></div>
  <div class="orb-core"></div>
</div>

<div id="oliver-canvas">
  <div id="canvas-backdrop" onclick="closeCanvas()"><div id="canvas-handle"></div></div>
  <div id="canvas-panel">
    <div id="canvas-header">
      <div id="canvas-title">
        <span id="canvas-title-text">Canvas</span>
        <span id="canvas-type-badge">code</span>
      </div>
      <div class="canvas-controls">
        <button class="canvas-header-btn" onclick="toggleMaximize()" aria-label="Maximize">
          <svg viewBox="0 0 24 24" id="max-icon"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <button class="canvas-header-btn" onclick="closeCanvas()" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <div id="canvas-body-wrap">
      <div id="canvas-body"></div>
      <button id="canvas-copy" onclick="copyCanvas()" style="display:none">Copy</button>
    </div>
  </div>
</div>

<header>
  <div class="header-center">
    <div class="status-pip"></div>
    <span class="header-title">Oliver AI</span>
  </div>
</header>

<div id="chat-container">
  <div class="message oliver">
    <div class="sender-row"><div class="sender-dot"></div><span class="sender-name">Oliver</span></div>
    <div class="oliver-card"><div class="msg-text"><div class="msg-para">I'm listening, Chris.</div></div></div>
  </div>
</div>

<div id="img-preview-bar">
  <div id="img-preview-wrap">
    <img id="img-preview" src="" alt="preview">
    <div id="img-preview-remove" onclick="clearImage()">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </div>
  </div>
  <div id="img-preview-info">
    <div id="img-preview-name"></div>
    <div>tap send to share with Oliver</div>
  </div>
</div>

<div id="waveform"></div>

<div class="controls">
  <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()" aria-label="Microphone">
    <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-2 16.93A8.001 8.001 0 0 0 19.94 12H18a6 6 0 0 1-12 0H4.06A8.001 8.001 0 0 0 10 17.93V21H8v2h8v-2h-2v-3.07z"/></svg>
  </button>
  <input type="text" id="text-input" placeholder="Message Oliver…" onkeydown="checkEnter(event)" autocomplete="off" autocorrect="off" spellcheck="false">
  <input type="file" id="file-input" accept="image/*" onchange="onImageSelected(event)">
  <button class="ctrl-btn" id="img-btn" onclick="document.getElementById('file-input').click()" aria-label="Upload image">

<script>
(function(){
  const cv=document.getElementById('star-canvas'),cx=cv.getContext('2d');
  let W,H;
  const resize=()=>{ W=cv.width=innerWidth; H=cv.height=innerHeight; };
  resize(); window.addEventListener('resize',resize);
  const STARS=Array.from({length:160},()=>({
    x:Math.random(),y:Math.random(),
    r:Math.random()*0.9+0.2,a:Math.random()*0.5+0.1,
    ts:Math.random()*0.015+0.005,to:Math.random()*Math.PI*2,
  }));
  const SHOTS=[];
  const spawn=()=>{
    const ang=(Math.random()*35+15)*Math.PI/180,spd=Math.random()*5+4;
    SHOTS.push({x:Math.random()*W,y:Math.random()*H*0.6,
      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      len:Math.random()*120+60,life:1,decay:Math.random()*0.012+0.010});
  };
  const schedule=()=>{ spawn(); setTimeout(schedule,Math.random()*1600+1200); };
  schedule();
  let t=0;
  (function draw(){
    cx.clearRect(0,0,W,H); t+=0.016;
    for(const s of STARS){
      const a=s.a*(0.6+0.4*Math.sin(t*s.ts*60+s.to));
      cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      cx.fillStyle=`rgba(255,255,255,${a})`; cx.fill();
    }
    for(let i=SHOTS.length-1;i>=0;i--){
      const s=SHOTS[i],mag=Math.hypot(s.vx,s.vy);
      const tx=s.x-s.vx*(s.len/mag),ty=s.y-s.vy*(s.len/mag);
      const g=cx.createLinearGradient(tx,ty,s.x,s.y);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(0.6,`rgba(200,170,255,${s.life*0.5})`);
      g.addColorStop(1,`rgba(255,255,255,${s.life})`);
      cx.beginPath(); cx.moveTo(tx,ty); cx.lineTo(s.x,s.y);
      cx.strokeStyle=g; cx.lineWidth=1.5; cx.stroke();
      const grd=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,3);
      grd.addColorStop(0,`rgba(255,255,255,${s.life})`); grd.addColorStop(1,'rgba(255,255,255,0)');
      cx.beginPath(); cx.arc(s.x,s.y,3,0,Math.PI*2); cx.fillStyle=grd; cx.fill();
      s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
      if(s.life<=0) SHOTS.splice(i,1);
    }
    requestAnimationFrame(draw);
  })();
})();

function getUIHistory() {

  recent.forEach(el => {
    const isOliver = el.classList.contains('oliver');
    let text = '';
    
    if (isOliver) {
      const msgEl = el.querySelector('.msg-text');
      text = msgEl ? msgEl.textContent : '';
    } else {
      const clone = el.cloneNode(true);
      const badge = clone.querySelector('.drive-badge');
      if(badge) badge.remove();
      text = clone.textContent.trim();
    }
    
    if(text) {
      historyArr.push({ role: isOliver ? 'assistant' : 'user', content: text.substring(0, 1000) });
    }
  });

  if (historyArr.length > 0 && historyArr[historyArr.length - 1].role === 'user') {

function unlockAudio(){
  if(audioUnlocked) return;
  const ctx=getAudioCtx();
  if(ctx.state==='suspended') ctx.resume();
  const buf=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();
  src.buffer=buf; src.connect(ctx.destination); src.start(0);
  audioUnlocked=true;
}

function cleanForTTS(text){
  return text
    .replace(/<CANVAS[\s\S]*?<\/CANVAS>/gi, '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/\*\*(.+?)\*\*/g,'$1')
    .replace(/\*(.+?)\*/g,'$1')
    .replace(/#+\s/g,'')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/\n{2,}/g,' ')
    .replace(/\n/g,' ')
    .replace(/\s{2,}/g,' ')
    .trim();
}

function extractCanvasAndMarkdown(text) {
  let processed = text;
  
  const canvasRe = /<CANVAS\s*(?:[^>]*?type="([^"]+)")?(?:[^>]*?title="([^"]*)")?[^>]*>([\s\S]*?)<\/CANVAS>/gi;
  processed = processed.replace(canvasRe, (match, type, title, content) => {
    const id = 'c_' + (++canvasIdCounter);
    
    let cleanContent = content
      .replace(/^\s*```[a-zA-Z]*\n?/i, '') 
      .replace(/\n?\s*```\s*$/i, '')       
      .trim();
      
    canvasStore[id] = { type: (type || 'code').toLowerCase(), title: title || type || 'code', content: cleanContent };
    
    setTimeout(() => {
        openStoredCanvas(id);
        const canvasEl = document.getElementById('oliver-canvas');
        if(canvasEl && canvasEl.classList.contains('open')) {
             if (isContinuous && recognition && !isRecording) {
                 startListening();

        }
    }, 400); 
    
    return `\n<button class="chat-canvas-btn" onclick="openStoredCanvas('${id}')">
              <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
              View ${title || type || 'Code'}
            </button>\n`;
  });

  const mdRe = /```(\w+)?\n([\s\S]*?)```/g;
  processed = processed.replace(mdRe, (match, lang, content) => {
    const id = 'c_' + (++canvasIdCounter);
    const type = lang || 'code';
    canvasStore[id] = { type: type, title: lang ? `Code (${lang})` : 'Code', content: content.trim() };
    
    setTimeout(() => {
        openStoredCanvas(id);
    }, 400); 

    return `\n<button class="chat-canvas-btn" onclick="openStoredCanvas('${id}')">
              <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
              View Code
            </button>\n`;
  });

  return processed.trim();
}

async function pipeline(userText, speakReply=true, imageBase64=null, imageMime=null, imageName=null){
  const interruptedFlag = window.hasInterrupted || false;
  window.hasInterrupted = false; 

  addMessage(userText, 'user', imageBase64, imageMime, imageName, speakReply);
  
  const runId = Date.now();
  isThinking++; 
  updateOrbState();

  const elapsed = Math.floor((Date.now()-sessionStart)/1000);
  const timeActive = `${Math.floor(elapsed/60)} minute(s) and ${elapsed%60} second(s)`;
  
  const uiHistory = getUIHistory(); 

  let imageContext='';
  if(imageBase64){
    imgBtn.classList.add('uploading');
    try{
      const driveResult=await uploadImageToDrive(imageBase64,imageMime||'image/jpeg',imageName||'image.jpg');
      if(driveResult.success){
        imageContext=`\n\n[IMAGE UPLOADED TO DRIVE: filename="${driveResult.filename}"]`;
        showDriveBadge(driveResult.filename);
      }
    }catch(err){ console.warn('Drive upload failed:',err); }
    finally{ imgBtn.classList.remove('uploading'); clearImage(); }
  }

  let thinkCounted = true; 
  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
      body: JSON.stringify({
        message: userText+imageContext,
        sessionDuration: timeActive,
        sessionId: getSessionId(),
        inputMode: speakReply?'voice':'text',
        voiceEnabled: speakReply,
        hasImage: !!imageBase64,
        uiHistory: uiHistory, 
        wasInterrupted: interruptedFlag 
      }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      
      if (value) {
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); 

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const data = JSON.parse(line);
              
              if (data.type === 'filler') {
                if (speakReply) speakText(data.text, runId); 
              } 
              else if (data.type === 'final') {
                const ttsCleanText = cleanForTTS(data.text);
                const processedReply = extractCanvasAndMarkdown(data.text);
                
                const msgEl = addMessage(processedReply, 'oliver', null, null, null, speakReply);
                
                if (speakReply && (processedReply.includes('chat-canvas-btn') || !ttsCleanText)) {
                    msgEl.classList.remove('hidden-voice');
                }
                
                if (speakReply && ttsCleanText) {
                  speakText(ttsCleanText, runId).then(success => {
                      if(!success && msgEl) msgEl.classList.remove('hidden-voice');
                  });
                }
              }
              else if (data.type === 'error') {
                 addMessage('System error: ' + data.text, 'oliver', null, null, null, false);
              }
            } catch (e) {
              console.error("NDJSON Parse error:", e);
            }
          }
      }

      if (done) {
          if (buffer.trim()) {
             try {
                const data = JSON.parse(buffer);
                if (data.type === 'final') {
                  const ttsCleanText = cleanForTTS(data.text);
                  const processedReply = extractCanvasAndMarkdown(data.text);
                  const msgEl = addMessage(processedReply, 'oliver', null, null, null, speakReply);
                  if (speakReply && (processedReply.includes('chat-canvas-btn') || !ttsCleanText)) msgEl.classList.remove('hidden-voice');
                  if (speakReply && ttsCleanText) {
                    speakText(ttsCleanText, runId).then(success => {
                        if(!success && msgEl) msgEl.classList.remove('hidden-voice');
                    });
                  }
                }
             } catch(e) {}
          }
          break; 
      }
    }
  } catch(err) {
    addMessage('Connection failed. '+err.message,'oliver', null, null, null, false);
  } finally {
    if (thinkCounted) {
        isThinking = Math.max(0, isThinking - 1);
        updateOrbState();
    }
  }
}

function speakText(text, runId) {
  if(!text) return Promise.resolve(false);
  return new Promise((resolve) => {
    audioQueue.push({ text, resolve, runId });
    processAudioQueue();
  });
}

async function processAudioQueue() {
  if(isPlayingQueue || audioQueue.length === 0) return;
  
  isPlayingQueue = true;
  updateOrbState(); 
  
  const { text, resolve, runId } = audioQueue.shift();
  currentPlayingRunId = runId;
  
  recentSpokenChunks.push(text.toLowerCase().replace(/[^\w\s]/gi, '')); 
  if (recentSpokenChunks.length > 3) recentSpokenChunks.shift(); 
  
  try {
    const ctx = getAudioCtx();
    if(ctx.state === 'suspended') await ctx.resume();
    
    const res = await fetch(XI_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
      body: JSON.stringify({text}),
    });
    
    if(!res.ok) throw new Error(`TTS ${res.status}`);
    
    const decoded = await ctx.decodeAudioData(await res.arrayBuffer());
    
    await new Promise((resEnded) => {
      const src = ctx.createBufferSource();
      src.buffer = decoded; 
      src.connect(ctx.destination);
      src.onended = () => { resEnded(); resolve(true); };
      src.start(0);
      currentAudio = src;
    });
    
  } catch(err) {
    console.warn('TTS error:', err);
    resolve(false);
  } finally {
    currentAudio = null;
    currentPlayingRunId = null; 
    isPlayingQueue = false;
    
    if(audioQueue.length > 0) {
      processAudioQueue();
    } else {
      updateOrbState(); 
    }
  }
}

function toggleContinuous(){

function startListening(){
  if(isRecording) return; 
  recognition = buildRecognition();
  if(!recognition) return;
  try{ recognition.start(); }catch(_){}
}

function calculateWordOverlap(spoken, lastSpoken) {
    if (!spoken || !lastSpoken) return 0;
    const w1 = spoken.split(' ').filter(w => w.length > 2);
    const w2 = lastSpoken.split(' ').filter(w => w.length > 2);
    if (w1.length === 0) return 0;
    let matches = 0;
    w1.forEach(w => { if(w2.includes(w)) matches++; });
    return matches / w1.length;
}

function buildRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) {
     addMessage("Speech recognition not supported in this browser.", 'oliver');
     return null;
  }
  const r = new SR();
  
  r.continuous = isContinuous; 
  r.interimResults = true; 
  r.lang = 'en-US';
  
  let walkieTalkieTimer;
  
  r.onstart = () => { 
    isRecording = true; 
    micBtn.classList.add('recording'); 
    interimEl.textContent = ''; 
    speechBuffer = '';
    updateOrbState();
  };
  
  r.onresult = (e) => {
    clearTimeout(walkieTalkieTimer);
    
    if (!isContinuous) {
        walkieTalkieTimer = setTimeout(() => { if(isRecording) stopRecording(true); }, 5000); 
    }
    
    let interim='', final='';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (final+=t) : (interim+=t);
    }
    
    // Display the accumulating buffer plus the current thought
    interimEl.textContent = (speechBuffer + ' ' + (interim || final)).trim();

    const rawText = (interim || final).trim().toLowerCase();
    const spokenText = rawText.replace(/[^\w\s]/gi, '');
    
    // AGGRESSIVE INTERIM DETECTION: Catches commands instantly before the final pause trigger
    const wakeRegex = /\b(oliver|olive|all over|all of her|hey oliver)\b/i;
    const hasWakeWord = wakeRegex.test(rawText); 
    const isStopCommand = /\b(stop oliver|stop listening|stop now)\b/i.test(rawText) || rawText === 'stop';
    
    const combinedRecentSpeech = recentSpokenChunks.join(" ");
    const overlapPercent = calculateWordOverlap(spokenText, combinedRecentSpeech);
    const isEcho = combinedRecentSpeech && (combinedRecentSpeech.includes(spokenText) || spokenText.includes(combinedRecentSpeech) || overlapPercent > 0.4);
    
    // INTERRUPTION: Cut his audio the millisecond he is named in the interim text
    if ((hasWakeWord || isStopCommand) && currentPlayingRunId && !isEcho) {
        audioQueue = audioQueue.filter(item => item.runId !== currentPlayingRunId);
        if (currentAudio) {
            try { currentAudio.stop(); } catch(_) {}
            currentAudio = null;
        }
        currentPlayingRunId = null;
        window.hasInterrupted = true; 
        updateOrbState();
    }

    // INSTANT STOP COMMAND GATE: Shuts down instantly, bypassing the final pause trigger
    if (isStopCommand && !isEcho) {
        interimEl.textContent = 'Conversation ended.';
        setTimeout(() => { interimEl.textContent = ''; }, 1500);
        if (isContinuous) toggleContinuous();
        else stopRecording();
        return;
    }

    if(final && !isEcho){ 
        // Append to our buffer instead of firing immediately
        speechBuffer += ' ' + final.trim();
        interimEl.textContent = speechBuffer.trim();
        
        clearTimeout(speechBufferTimeout);
        speechBufferTimeout = setTimeout(() => {
            const userText = speechBuffer.trim();
            speechBuffer = ''; // Clear the buffer
            interimEl.textContent = ''; 
            
            if (userText) {
                pipeline(userText, true); 
            }

            if (!isContinuous) {
                stopRecording(false); 
            }
        }, 1500); // Wait 1.5 seconds for absolute silence before committing the sentence
    }
  };
  
  r.onerror = (e) => { 
    console.warn('Speech error:',e.error); 
    if(e.error === 'not-allowed') {
        isContinuous = false; convoBtn.classList.remove('active');
        addMessage("Microphone access denied.", 'oliver');
    }
    if (!isContinuous) stopRecording(); 
  };
  
  r.onend = () => { 
    isRecording = false;
    micBtn.classList.remove('recording');
    
    if (isContinuous) {
        setTimeout(() => startListening(), 100);
    } else {
        updateOrbState();
    }
  };
  return r;
}

function toggleMic(){
  unlockAudio();
  
  if (isContinuous) {
      toggleContinuous();
      return;
  }

  if (currentPlayingRunId) {
      audioQueue = audioQueue.filter(item => item.runId !== currentPlayingRunId);
      if (currentAudio) { try{ currentAudio.stop(); } catch(_) {} currentAudio = null; }
      currentPlayingRunId = null;
      window.hasInterrupted = true; 
      updateOrbState();
      
      startListening();
      return;
  }

  if (isRecording) { stopRecording(true); return; }
  startListening();
}

function stopRecording(processCurrent = false){
  isRecording = false;
  micBtn.classList.remove('recording');
  
  let capturedText = interimEl.textContent.trim();
  
  // Flush any pending words stuck in the pause buffer
  if (speechBuffer) {
      capturedText = speechBuffer.trim();
  }
  speechBuffer = '';
  clearTimeout(speechBufferTimeout);

  interimEl.textContent = '';
  
  try{ if(recognition) recognition.stop(); }catch(_){}
  
  updateOrbState();
  
  if(processCurrent && capturedText) {
     pipeline(capturedText, true);
  }
}

const canvasEl     =document.getElementById('oliver-canvas');
const canvasBody   =document.getElementById('canvas-body');
const canvasCopy   =document.getElementById('canvas-copy');
const canvasBadge  =document.getElementById('canvas-type-badge');
const canvasTTitle =document.getElementById('canvas-title-text');
let canvasRawContent='';
let isMaximized = false;

function openStoredCanvas(id) {
  const data = canvasStore[id];
  if(data) openCanvas(data.type, data.title, data.content);
}

function openCanvas(type, title, content){
  if(['html','js','json','css','python','ts','typescript','javascript','sh','bash'].includes(type)) type = 'code';
  if(['mp4','webm','mov'].includes(type)) type = 'video';
  
  canvasTTitle.textContent=title||'Canvas';
  canvasBadge.textContent=type||'code';
  canvasRawContent=content;
  canvasBody.className='type-'+type;
  canvasBody.innerHTML='';
  canvasCopy.style.display='none';
  
  if(type==='code'){
    const wrap = document.createElement('div'); wrap.id = 'canvas-code-wrap';
    const pre=document.createElement('pre'); pre.id='canvas-code';
    pre.innerHTML=syntaxHighlight(content); 
    wrap.appendChild(pre); canvasBody.appendChild(wrap); canvasCopy.style.display='block';
  } else if(type==='image'){
    const img=document.createElement('img'); img.id='canvas-img';
    img.src=content.trim(); img.alt=title||'Image'; canvasBody.appendChild(img);
  } else if(type==='pdf'){
    const obj=document.createElement('object'); 
    obj.data=content.trim(); obj.type="application/pdf"; obj.style.width="100%"; obj.style.height="100%";
    canvasBody.appendChild(obj);
  } else if(type==='video'){
    const vid=document.createElement('video'); vid.className='canvas-vid'; vid.controls=true; vid.autoplay=true;
    const src=document.createElement('source'); src.src=content.trim(); vid.appendChild(src);
    canvasBody.appendChild(vid);
  } else if(type==='html_preview'){
    const iframe=document.createElement('iframe'); iframe.id='canvas-iframe'; iframe.sandbox='allow-scripts';
    canvasBody.appendChild(iframe);
    iframe.contentDocument.open(); iframe.contentDocument.write(content); iframe.contentDocument.close();
  } else if(type==='markdown'){
    canvasBody.innerHTML=renderMarkdown(content);
  } else {
    const wrap = document.createElement('div'); wrap.id = 'canvas-code-wrap';
    const pre=document.createElement('pre'); pre.id='canvas-code'; pre.textContent=content;
    wrap.appendChild(pre); canvasBody.appendChild(wrap); canvasCopy.style.display='block';
  }
  canvasEl.classList.add('open');
}

function closeCanvas(){ canvasEl.classList.remove('open'); }

function toggleMaximize(){
  isMaximized = !isMaximized;
  const panel = document.getElementById('canvas-panel');
  const backdrop = document.getElementById('canvas-backdrop');
  const handle = document.getElementById('canvas-handle');
  const maxIcon = document.getElementById('max-icon');
  
  if(isMaximized) {
    panel.style.borderRadius = '0';
    backdrop.style.flex = '0';
    handle.style.display = 'none';
    maxIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
  } else {
    panel.style.borderRadius = '24px 24px 0 0';
    backdrop.style.flex = '0 0 60px';
    handle.style.display = 'block';
    maxIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
  }
}

function copyCanvas(){
  navigator.clipboard.writeText(canvasRawContent).catch(()=>{});
  canvasCopy.textContent='Copied!';
  setTimeout(()=>{ canvasCopy.textContent='Copy'; },1800);
}

(function(){
  let startY=0;
  const panel=document.getElementById('canvas-panel');
  panel.addEventListener('touchstart',e=>{ startY=e.touches[0].clientY; },{passive:true});
  panel.addEventListener('touchend',e=>{ if(!isMaximized && e.changedTouches[0].clientY-startY>80) closeCanvas(); },{passive:true});
})();

function syntaxHighlight(code){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return code.split('\n').map((line)=>{
    let parsed = line;
    if(/^\s*(\/\/|#|--|\/\*)/.test(line)) {
      parsed = `<span class="tok-cmt">${esc(line)}</span>`;
    } else {
      parsed = esc(line)
        .replace(/(&#39;.*?&#39;|&quot;.*?&quot;|`.*?`)/g,'<span class="tok-str">$1</span>')
        .replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>')
        .replace(/\b(const|let|var|function|return|if|else|for|while|class|import|export|from|async|await|try|catch|new|this|null|undefined|true|false|def|self|print|in|is|not|and|or|type|interface|extends|implements|public|private|static|void|int|string|bool)\b/g,'<span class="tok-kw">$1</span>')
        .replace(/([a-zA-Z_$][a-zA-Z0-9_$]*)\s*(?=\()/g,'<span class="tok-fn">$1</span>');
    }
    return `<div class="line-row"><span class="line-num"></span><span class="line-content">${parsed||' '}</span></div>`;
  }).join('');
}

function renderMarkdown(md){
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/```(\w+)?\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/^\- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>')
    .replace(/^---$/gm,'<hr>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/\n\n/g,'</p><p>').replace(/^(?!<[hupli]|<\/[hupli]|<pre)(.+)$/gm,'<p>$1</p>');
}
